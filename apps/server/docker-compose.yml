services:
  postgres:
    image: postgres:17-alpine
    container_name: media_creator_pg
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_creator
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
